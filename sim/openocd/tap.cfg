#-----------------------------------------------------------------------------
# Title      : OpenOCD configuration of the co-simulation of the kit
# Project    : Asylum
#-----------------------------------------------------------------------------
# File       : tap.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 connected to tb_openocd through the
#              remote_bitbang adapter (rbb_server.c of the kit, port 9824),
#              then the checks of the TAP model : IDCODE (-expected-id of the
#              scan of the chain and a DR scan), DR scans of the user data
#              register (each scan returns the data of the previous one),
#              TRST (IDCODE selected again), SRST. Prints "SCENARIO PASS" or
#              "SCENARIO FAIL", then shutdown.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-24  1.0      mrosiere Created
#-----------------------------------------------------------------------------

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9824
transport select jtag

reset_config trst_and_srst

# tb_jtag_tap of tb_openocd : IR of 5 bits
jtag newtap tb tap -irlen 5 -expected-id 0x5a7c3e1b

gdb_port    disabled
tcl_port    disabled
telnet_port disabled

init

set fail 0
proc check {name got exp} {
    global fail
    if {[expr {"0x$got" == $exp}]} {
        echo "OK   : $name : 0x$got"
    } else {
        echo "FAIL : $name : 0x$got instead of $exp"
        set fail 1
    }
}

# IDCODE (opcode 1)
irscan tb.tap 1
check "IDCODE"                 [drscan tb.tap 32 0]      0x5a7c3e1b

# User data register (opcode 2) : each scan returns the data of the previous
# one
irscan tb.tap 2
check "USER after the reset"   [drscan tb.tap 16 0xa5c3] 0x0000
check "USER, first scan"       [drscan tb.tap 16 0x3c5a] 0xa5c3
check "USER, second scan"      [drscan tb.tap 16 0x0000] 0x3c5a

# TRST : Test-Logic-Reset, IDCODE selected. After TRST, OpenOCD assumes
# BYPASS : IR scan first.
adapter assert   trst
adapter deassert trst
irscan tb.tap 1
check "IDCODE after TRST"      [drscan tb.tap 32 0]      0x5a7c3e1b

# SRST : seen by the testbench
adapter assert   srst
adapter deassert srst

if {$fail} {
    echo "SCENARIO FAIL"
} else {
    echo "SCENARIO PASS"
}
shutdown
