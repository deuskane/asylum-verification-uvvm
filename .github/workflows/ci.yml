name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
#<GENERATE_BEGIN>
  sim_apb:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_apb

  sim_apb_back_to_back:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_apb_back_to_back

  sim_apb_pslverr:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_apb_pslverr

  sim_apb_reset_values:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_apb_reset_values

  sim_apb_timeout:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_apb_timeout

  sim_apb_wait_states:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_apb_wait_states

  sim_apb_write_read:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_apb_write_read

  sim_jtag:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag

  sim_jtag_bypass:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_bypass

  sim_jtag_idcode:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_idcode

  sim_jtag_idle:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_idle

  sim_jtag_ir8:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_ir8

  sim_jtag_ir_capture:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_ir_capture

  sim_jtag_ir_capture_error:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_ir_capture_error

  sim_jtag_reset_tms:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_reset_tms

  sim_jtag_reset_trst:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_reset_trst

  sim_jtag_trst:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_trst

  sim_jtag_user_dr:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_jtag_user_dr

  badges:
    needs: [sim_apb, sim_apb_back_to_back, sim_apb_pslverr, sim_apb_reset_values, sim_apb_timeout, sim_apb_wait_states, sim_apb_write_read, sim_jtag, sim_jtag_bypass, sim_jtag_idcode, sim_jtag_idle, sim_jtag_ir8, sim_jtag_ir_capture, sim_jtag_ir_capture_error, sim_jtag_reset_tms, sim_jtag_reset_trst, sim_jtag_trst, sim_jtag_user_dr]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: deuskane/asylum-ci/.github/workflows/badges.yml@main
    with:
      results: ${{ toJSON(needs) }}

#<GENERATE_END>
